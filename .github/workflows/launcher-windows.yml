name: Validar Curiosidades Studio unificado
on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-windows.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-windows.yml'
jobs:
  unit_linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Testar sequência e tratamento de falhas
        working-directory: launcher
        run: go test -v ./...
  build_windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compilar iniciador Windows
        working-directory: launcher
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam" }
          go build -trimpath -ldflags="-s -w" -o "../CuriosidadesStudio_Executor_Windows.exe" .
          if ($LASTEXITCODE -ne 0) { throw "Compilacao falhou" }
          if (-not (Test-Path "../CuriosidadesStudio_Executor_Windows.exe")) { throw "EXE ausente" }
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-nao-validado-com-voz-real
          path: CuriosidadesStudio_Executor_Windows.exe
          retention-days: 7
