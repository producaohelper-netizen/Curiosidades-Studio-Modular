name: Ollama local cria desenhos CPU de 3 temas
on:
  push:
    paths:
      - 'ci/live_vector_llm.py'
      - '.github/workflows/live-vector-llm.yml'
  workflow_dispatch:
jobs:
  ollama_vector:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow e Ollama oficial no runner isolado
        run: |
          python -m pip install 'Pillow>=11,<13'
          curl -fsSL https://ollama.com/install.sh | sh
      - name: Preparar modelo leve gratuito no runner
        run: |
          nohup ollama serve >/tmp/ollama-server.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen2.5:1.5b
      - name: Desenhar três personagens reais no Ollama
        run: |
          set -o pipefail
          PYTHONPATH=. python -u ci/live_vector_llm.py | tee vector-ollama.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desenhos-ollama-cpu-amostra-tecnica
          path: |
            ollama-vector-test/*.png
            ollama-vector-test/contact.jpg
            ollama-vector-test/report.json
            vector-ollama.log
          retention-days: 5
