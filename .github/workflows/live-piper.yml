name: Narração real brasileira Piper CPU
on:
  workflow_dispatch:
  push:
    paths:
      - 'universal_engine/narration.py'
      - '.github/workflows/live-piper.yml'
jobs:
  piper_cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar motor de voz gratuito
        run: python -m pip install piper-tts
      - name: Baixar voz pt-BR com versão e licença conhecidas
        run: |
          mkdir -p voice
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium'
          curl --fail --location --retry 3 "$BASE/pt_BR-faber-medium.onnx" -o voice/pt_BR-faber-medium.onnx
          curl --fail --location --retry 3 "$BASE/pt_BR-faber-medium.onnx.json" -o voice/pt_BR-faber-medium.onnx.json
          test "$(stat -c%s voice/pt_BR-faber-medium.onnx)" -gt 30000000
      - name: Sintetizar e medir falas pt-BR reais
        run: |
          python - <<'PY'
          import json, pathlib, math, wave, struct
          from universal_engine.narration import generate_piper
          lines=[
            'Você sabia que um polvo pode liberar tinta para escapar de um predador?',
            'A Terra gira enquanto o dia e a noite mudam diante dos nossos olhos.',
            'Os antigos egípcios utilizaram organização e engenharia para erguer as pirâmides.'
          ]
          model=pathlib.Path('voice/pt_BR-faber-medium.onnx')
          results=[]
          for i,line in enumerate(lines):
              result=generate_piper(line,model,pathlib.Path('voice')/f'ptbr_{i}.wav',
                                    timeout=300)
              with wave.open(result['path'],'rb') as w:
                  data=w.readframes(w.getnframes())
                  sample_width=w.getsampwidth()
                  assert sample_width==2
                  import array
                  samples=array.array('h');samples.frombytes(data)
                  rms=math.sqrt(sum(float(x*x) for x in samples)/max(1,len(samples)))
                  assert rms>100, f'Aúdio silencioso, RMS={rms}'
              assert 1<result['duration']<20, result
              results.append({'line':line,'duration':result['duration'],'rms':rms})
          again=generate_piper(lines[0],model,pathlib.Path('voice')/'ptbr_0.wav',
                               timeout=300)
          assert again['reused'], 'Cache vocal deveria ser reutilizado'
          pathlib.Path('voice/audio_quality_report.json').write_text(
              json.dumps({'provider':'Piper pt_BR-faber-medium v1.0.0',
                          'human_quality_approval':'NOT_PERFORMED',
                          'results':results},indent=2,ensure_ascii=False),encoding='utf8')
          print(json.dumps(results,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-voz-real-pt-br-nao-final
          path: |
            voice/ptbr_*.wav
            voice/audio_quality_report.json
          retention-days: 7
