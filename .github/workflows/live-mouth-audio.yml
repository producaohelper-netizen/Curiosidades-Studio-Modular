name: Validar boca animada com voz Piper real
on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/live_mouth_audio.py'
      - 'universal_engine/mouth_sync.py'
      - 'universal_engine/mouth_overlay.py'
      - 'universal_engine/layer_renderer.py'
      - '.github/workflows/live-mouth-audio.yml'
jobs:
  render_real_speech:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de render e voz
        run: |
          python -m pip install 'Pillow>=11,<13' piper-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Baixar voz brasileira livre
        run: |
          mkdir -p voice
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium'
          curl --fail --location --retry 3 "$BASE/pt_BR-faber-medium.onnx" -o voice/pt_BR-faber-medium.onnx
          curl --fail --location --retry 3 "$BASE/pt_BR-faber-medium.onnx.json" -o voice/pt_BR-faber-medium.onnx.json
          test "$(stat -c%s voice/pt_BR-faber-medium.onnx)" -gt 30000000
      - name: Renderizar MP4 com fala real e boca variavel
        run: python -m ci.live_mouth_audio
      - name: Conferir MP4 e audio AAC
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate -of default=noprint_wrappers=1 live-mouth/mouth_real_audio.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 live-mouth/mouth_real_audio.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voz-real-boca-animada-teste-tecnico
          path: |
            live-mouth/mouth_real_audio.mp4
            live-mouth/report.json
          retention-days: 7
