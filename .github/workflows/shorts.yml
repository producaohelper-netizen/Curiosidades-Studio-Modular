name: Gerar Shorts - Buraco Negro
on:
  workflow_dispatch:
  push:
    paths:
      - render.py
      - .github/workflows/shorts.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install numpy scipy edge-tts
      - run: python render.py
      - run: ffprobe -v error -show_entries format=duration:stream=width,height -of json buraco-negro.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: buraco-negro-shorts
          path: buraco-negro.mp4
