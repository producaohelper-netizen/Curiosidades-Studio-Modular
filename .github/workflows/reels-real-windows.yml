name: Reels real Piper e MP4 Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'oneclick/**'
      - 'universal_engine/reel_*.py'
      - 'universal_engine/shortform.py'
      - 'tests/test_reel*.py'
      - '.github/workflows/reels-real-windows.yml'
jobs:
  windows_real_piper_mp4:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Instalar Piper e Pillow
        run: python -m pip install piper-tts "Pillow>=11,<13"
      - name: Instalar FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg=(Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          if (-not $ffmpeg) { throw 'FFmpeg ausente' }
          Add-Content $env:GITHUB_PATH (Split-Path $ffmpeg)
      - name: Baixar modelo Piper pt-BR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force voice | Out-Null
          $base='https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium'
          Invoke-WebRequest "$base/pt_BR-faber-medium.onnx" -OutFile voice/pt_BR-faber-medium.onnx
          Invoke-WebRequest "$base/pt_BR-faber-medium.onnx.json" -OutFile voice/pt_BR-faber-medium.onnx.json
          if ((Get-Item voice/pt_BR-faber-medium.onnx).Length -lt 30000000) { throw 'Modelo incompleto' }
      - name: Compilar executável Windows
        shell: pwsh
        run: |
          Push-Location oneclick
          go test ./...
          go build -trimpath -o ../CuriosidadesStudio_Windows_Reels_CANDIDATO.exe .
          Pop-Location
      - name: Gerar roteiro e imagens sintéticas de teste
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('reel_test')
          root.mkdir(exist_ok=True)
          sections={
            "hook":"Você sabia que um polvo possui três corações? Parece ficção, mas sua anatomia surpreende os pesquisadores.",
            "context":"Dois desses corações ajudam a enviar sangue às brânquias, enquanto outro impulsiona o sangue pelo restante do corpo.",
            "development":"O sangue do polvo contém hemocianina, proteína rica em cobre, que auxilia no transporte de oxigênio em ambientes marinhos.",
            "reveal":"Essa adaptação ajuda a explicar como esses animais vivem no oceano. As imagens deste teste são apenas ilustrações abstratas."
          }
          script={"pillar":"ciencia_natureza","target_seconds":45,"sections":sections,
                  "claims":[{"text":"Anatomia do polvo requer revisão factual.","status":"unknown"}],
                  "sources":[
                    {"title":"Smithsonian Ocean","publisher":"Smithsonian","url":"https://ocean.si.edu/"},
                    {"title":"Natural History Museum","publisher":"NHM","url":"https://www.nhm.ac.uk/"}]}
          (root/'roteiro.json').write_text(json.dumps(script,ensure_ascii=False),encoding='utf8')
          for i in range(4):
            Image.new('RGB',(180,320),(35+i*40,50,90)).save(root/f'visual_{i}.png')
          '@ | Set-Content -Encoding utf8 reel_test_setup.py
          python reel_test_setup.py
      - name: Sintetizar voz real Piper e legendas
        shell: pwsh
        run: |
          python -m universal_engine.reel_narration --input reel_test/roteiro.json --voice-model voice/pt_BR-faber-medium.onnx --piper piper --output-dir reel_test/output
      - name: Renderizar MP4 de teste reduzido com áudio real
        shell: pwsh
        run: |
          @'
          import json, subprocess
          from pathlib import Path
          from universal_engine.reel_render import render_reel
          data=json.loads(Path('reel_test/output/narracao_e_legendas.json').read_text(encoding='utf8'))
          imgs=[f'reel_test/visual_{i}.png' for i in range(4)]
          report=render_reel(data['audio_path'],data['reel_caption_cues'],imgs,'reel_test/output/reel_real_piper.mp4',size=(180,320),fps=12)
          streams=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',report['output']]))['streams']
          assert any(s['codec_type']=='audio' for s in streams)
          assert any(s['codec_type']=='video' and s['width']==180 and s['height']==320 for s in streams)
          assert report['duration']>20
          Path('reel_test/output/verification.json').write_text(json.dumps(report,indent=2),encoding='utf8')
          print(report)
          '@ | Set-Content -Encoding utf8 reel_real_check.py
          python reel_real_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels-windows-piper-real-smoke-nao-final
          path: |
            CuriosidadesStudio_Windows_Reels_CANDIDATO.exe
            reel_test/output/reel_real_piper.mp4
            reel_test/output/verification.json
          retention-days: 7
