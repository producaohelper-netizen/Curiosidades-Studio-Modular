name: Cobertura ilustrada real de três assuntos
on:
  push:
    paths:
      - 'ci/live_vector_coverage.py'
      - '.github/workflows/live-vector-coverage.yml'
  workflow_dispatch:
jobs:
  cover_topics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar OpenCLIP e Pillow
        run: python -m pip install 'Pillow>=11,<13' open_clip_torch
      - name: Consultar desenhos vetoriais reais e suas licenças
        run: |
          set -o pipefail
          PYTHONPATH=. python -u ci/live_vector_coverage.py | tee vector-coverage.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amostra-cobertura-desenhos-nao-final
          path: |
            vector-test/report.json
            vector-test/**/final.png
            vector-coverage.log
          retention-days: 7
