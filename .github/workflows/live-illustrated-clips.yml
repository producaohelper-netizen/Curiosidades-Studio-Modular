name: Amostra ilustrada real - animais e vulcões
on:
  push:
    paths:
      - 'ci/live_illustrated_clips.py'
      - '.github/workflows/live-illustrated-clips.yml'
  workflow_dispatch:
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramentas de voz e vídeo
        run: |
          python -m pip install 'Pillow>=11,<13' open_clip_torch piper-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Obter voz pt-BR gratuita
        run: |
          mkdir -p voice
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium'
          curl -fsSL --retry 3 "$BASE/pt_BR-faber-medium.onnx" -o voice/pt_BR-faber-medium.onnx
          curl -fsSL --retry 3 "$BASE/pt_BR-faber-medium.onnx.json" -o voice/pt_BR-faber-medium.onnx.json
      - name: Produzir animações reais independentes
        run: |
          set -o pipefail
          PYTHONPATH=. python -u ci/live_illustrated_clips.py | tee illustrated-render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revisao-clipes-ilustrados-voz-real
          path: |
            real-illustrated-test/*/clip.mp4
            real-illustrated-test/*/sprite.png
            real-illustrated-test/*/background.png
            real-illustrated-test/report.json
            illustrated-render.log
          retention-days: 7
