name: Provedores reais - Commons e OpenCLIP
on:
  push:
    paths:
      - '.github/workflows/live-assets.yml'
      - 'universal_engine/media_sources.py'
      - 'universal_engine/visual_matcher.py'
  workflow_dispatch:
jobs:
  live_asset_lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramentas locais de matching
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Pillow>=11,<13' open_clip_torch
      - name: Testar consulta Wikimedia e licença
        run: |
          python - <<'PY'
          from universal_engine.media_sources import search_commons
          from pathlib import Path
          import json
          candidates=[]
          for query in ('octopus underwater', 'Earth from space', 'volcano eruption'):
              try:
                  candidates=search_commons(query,limit=15)
              except Exception as exc:
                  print('Erro Wikimedia:',type(exc).__name__,exc)
              if candidates:
                  break
          print('Imagens elegíveis:',len(candidates))
          if not candidates:
              raise SystemExit('Nenhuma imagem licenciada acessível — teste real reprovado')
          c=candidates[0]
          print('Primeira licença:',c.license_name)
          assert c.license_verified and c.license_url and c.page_url and c.attribution
          Path('live-commons.json').write_text(json.dumps({
              'title':c.title,'url':c.image_url,'license':c.license_name,
              'attribution':c.attribution},ensure_ascii=False,indent=2))
          PY
      - name: Executar OpenCLIP real em imagem local
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from PIL import Image
          from universal_engine.visual_matcher import OpenCLIPMatcher
          with tempfile.TemporaryDirectory() as d:
              a=Path(d)/'blue.png';b=Path(d)/'orange.png'
              Image.new('RGB',(128,128),'blue').save(a)
              Image.new('RGB',(128,128),'orange').save(b)
              m=OpenCLIPMatcher()
              result=m.score('a plain solid blue square',[a,b])
              print('Similaridade imagem azul x laranja:',result)
              assert len(result)==2
              assert all(-1.001<=v<=1.001 for v in result)
          PY
      - name: Testar associacao semantica real entre dois assuntos
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from universal_engine.media_sources import search_commons
          from universal_engine.visual_pipeline import download_commons
          from universal_engine.visual_matcher import OpenCLIPMatcher
          images=[]
          with TemporaryDirectory() as tmp:
              for name,query in [('polvo','octopus underwater'),('vulcao','volcano eruption')]:
                  found=False
                  for candidate in search_commons(query,limit=10):
                      try:
                          p=download_commons(candidate,Path(tmp)/(name+'.png'))
                          images.append(p);found=True
                          print(name,'license:',candidate.license_name)
                          break
                      except Exception as err:
                          print('skip',name,type(err).__name__)
                  if not found:raise SystemExit('Faltam imagens reais: '+name)
              m=OpenCLIPMatcher()
              scores=m.score('photo of a real octopus in the ocean',images)
              print('Similarity octopus image vs volcano image:',scores)
              if not scores[0]>scores[1]:
                  raise SystemExit('OpenCLIP nao associou imagem e tema corretamente')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-provider-test-report
          path: live-commons.json
          retention-days: 3
