name: Integracao do motor de video
on:
  push:
    paths:
      - 'ci/**'
      - '.github/workflows/full-pipeline.yml'
  pull_request:
    paths:
      - 'ci/**'
      - '.github/workflows/full-pipeline.yml'
  workflow_dispatch:
jobs:
  linux_video:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de desenho e montagem
        run: |
          python -m pip install 'Pillow>=11,<13'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Extrair fontes versionadas
        run: unzip -oq ci/curiosidades_source.zip
      - name: Aplicar correcao de cache do renderizador
        run: git apply --check ci/render_cache_fix.patch && git apply ci/render_cache_fix.patch
      - name: Compilar e testar modulo Go
        working-directory: CuriosidadesStudio_Modular_Fonte
        run: go test -v ./...
      - name: Renderizar episodio de integracao (Ollama/Piper simulados)
        run: |
          python integration_smoke.py | tee integracao.log
      - name: Publicar log da simulacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-video-simulado-nao-e-producao
          path: integracao.log
          retention-days: 7
  windows_modules:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extrair fontes versionadas
        shell: pwsh
        run: Expand-Archive ci/curiosidades_source.zip -DestinationPath . -Force
      - name: Aplicar correcao do renderizador no Windows
        shell: pwsh
        run: |
          git apply --check ci/render_cache_fix.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch nao aplica' }
          git apply ci/render_cache_fix.patch
          if ($LASTEXITCODE -ne 0) { throw 'Erro no patch' }
      - name: Compilar seis etapas e testar etapa 02 nativa
        shell: pwsh
        run: ./windows_smoke.ps1
      - name: Validar Python do roteiro
        shell: pwsh
        run: python -m py_compile CuriosidadesStudio_Modular/03_Gerar_Roteiro_SEGURO.py
      - name: Compilar os seis executaveis
        shell: pwsh
        run: |
          Push-Location CuriosidadesStudio_Modular_Fonte
          1..6 | ForEach-Object {
            go build -ldflags "-X main.stage=$($_)" -o "../0$($_)_modulo.exe" .
            if ($LASTEXITCODE -ne 0) { throw "Erro no modulo $_" }
          }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: seis-modulos-windows-para-teste
          path: 0?_modulo.exe
          retention-days: 7
